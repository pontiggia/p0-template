# Valores permitidos (CHECK constraints en la base). Todos en texto.

sale_status:            # sale.status
  pending:   "pendiente — el cliente todavía debe algo de esta venta. INCLUIDA en métricas"
  paid:      "pagada — deuda 0. INCLUIDA en métricas"
  cancelled: "anulada (R5, solo si no tenía pagos). EXCLUIDA de toda métrica"
  refunded:  "reembolsada (R6). EXCLUIDA de toda métrica"

sale_item_kind:         # sale_item.kind
  product: "producto del catálogo (product_id); tiene costo y stock"
  service: "servicio / mano de obra (service_id); margen puro, sin stock, sin Ganancia IVA"

ledger_kind:            # client_ledger_entry.kind — signo y significado
  sale:            { sign: "+", meaning: "venta cargada a la cuenta del cliente (+total)" }
  payment:         { sign: "−", meaning: "plata recibida (tiene payment_method). Base del 'cobrado'" }
  discount:        { sign: "−", meaning: "bonificación (no se movió plata)" }
  tax_withholding: { sign: "−", meaning: "retención impositiva (no se movió plata)" }
  opening_balance: { sign: "±", meaning: "deuda (+) o crédito (−) inicial pre-sistema / migración" }
  adjustment:      { sign: "±", meaning: "corrección: diferencia de precio R7/R12, o reversión de un pago R11 (+monto, reverses_entry_id)" }
  cancellation:    { sign: "−", meaning: "anula la entrada 'sale' de una venta anulada o reembolsada" }
  refund:          { sign: "+", meaning: "plata devuelta al cliente en un reembolso (R6)" }

payment_method:         # client_ledger_entry.payment_method y cash_movement.method
  efectivo:      "efectivo / cash"
  credito:       "tarjeta de crédito"
  debito:        "tarjeta de débito"
  transferencia: "transferencia bancaria"
  cheque:        "cheque"
  "cta cte":     "SOLO HISTÓRICO (datos migrados); hoy 'a cuenta' = venta pending"

currency:               # client_ledger_entry.currency, cash_movement.currency
  ARS: "pesos (default)"
  USD: "pago hecho en dólares: amount_centavos sigue en pesos; amount_usd_centavos y fx_rate_centavos guardan el detalle"

cash_kind:              # cash_movement.kind
  payment_received: "+ cobro de cliente (automático)"
  expense:          "− egreso / gasto manual"
  income:           "+ ingreso manual"
  refund:           "− devolución de plata a un cliente"
  adjustment:       "± correcciones y saldos iniciales por método (migración)"
  opening_count:    "reservado"

stock_kind:             # stock_movement.kind
  sale:          "− salida por venta"
  sale_reverted: "+ vuelve al stock (anulación, reembolso con reposición, cambio de producto)"
  purchase:      "+ compra / ingreso de mercadería"
  adjustment:    "± ajuste manual"
  initial:       "stock inicial migrado"

actor_type:             # audit_event.actor_type
  user:   "una persona desde la app"
  agent:  "el agente (credencial de API); on_behalf_of = la persona"
  system: "procesos automáticos / migración"

role:                   # store_membership.role
  superadmin: "dueño"
  admin:      "administrador"
  operator:   "operador (no ve montos si can_view_money = false)"
