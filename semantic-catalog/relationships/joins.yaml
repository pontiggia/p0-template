# Cómo se relacionan las tablas. REGLA: en cada JOIN repetí store_id = 1 para cada tabla de dominio.

relationships:
  - { from: sale.client_id,                to: client.id,              type: many_to_one }
  - { from: sale.sold_by_user_id,          to: app_user.id,            type: many_to_one }
  - { from: sale_item.sale_id,             to: sale.id,                type: many_to_one, note: "1..n líneas por venta (la mayoría tiene 1)" }
  - { from: sale_item.product_id,          to: product.id,             type: many_to_one, note: "solo kind = 'product'" }
  - { from: sale_item.service_id,          to: service.id,             type: many_to_one, note: "solo kind = 'service'" }
  - { from: client_ledger_entry.client_id, to: client.id,              type: many_to_one }
  - { from: client_ledger_entry.sale_id,   to: sale.id,                type: many_to_one, note: "NULL en pagos a cuenta y deudas iniciales" }
  - { from: client_ledger_entry.reverses_entry_id, to: client_ledger_entry.id, type: one_to_one, note: "reversión R11 → pago original" }
  - { from: cash_movement.ledger_entry_id, to: client_ledger_entry.id, type: many_to_one, note: "cobro de caja generado por un pago" }
  - { from: cash_movement.reverses_movement_id, to: cash_movement.id,  type: one_to_one }
  - { from: stock_movement.product_id,     to: product.id,             type: many_to_one }
  - { from: stock_movement.sale_item_id,   to: sale_item.id,           type: many_to_one }
  - { from: product_price_history.product_id, to: product.id,          type: many_to_one }
  - { from: store_membership.user_id,      to: app_user.id,            type: many_to_one }
  - { from: audit_event.actor_user_id,     to: app_user.id,            type: many_to_one }

join_patterns:
  lineas_con_su_venta: |
    FROM sale_item i
    JOIN sale s ON s.id = i.sale_id AND s.store_id = 1
    WHERE i.store_id = 1 AND s.status IN ('pending','paid')
  lineas_con_producto: |
    FROM sale_item i
    JOIN sale s    ON s.id = i.sale_id AND s.store_id = 1
    JOIN product p ON p.id = i.product_id AND p.store_id = 1      -- LEFT JOIN si también querés servicios
    WHERE i.store_id = 1 AND i.kind = 'product' AND s.status IN ('pending','paid')
  ventas_con_cliente: |
    FROM sale s
    JOIN client c ON c.id = s.client_id AND c.store_id = 1
    WHERE s.store_id = 1
  saldo_por_cliente: |
    FROM client_ledger_entry l
    JOIN client c ON c.id = l.client_id AND c.store_id = 1
    WHERE l.store_id = 1
    GROUP BY c.id, c.local_id, c.name

pitfalls:
  - "Sumar sale.total_centavos después de JOIN con sale_item lo multiplica por la cantidad de líneas: agregá la venta y las líneas por separado, o usá count(DISTINCT s.id)."
  - "La deuda viene del ledger, no de sale: no la calcules como total de ventas pendientes."
  - "client_ledger_entry tiene una fila 'sale' por venta: para métricas de venta usá sale/sale_item, no el ledger."
