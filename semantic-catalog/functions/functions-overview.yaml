# Cómo se ejecuta el SQL y expresiones útiles.

gateway:
  name: execute_readonly_sql(query text) → jsonb
  description: |
    executeSQL manda tu SELECT a esta función, que lo envuelve como
    SELECT jsonb_agg(row_to_json(t)) FROM (SELECT * FROM (<tu consulta>) q LIMIT 1000) t
    con un timeout de 5 s, conectada con un rol de SOLO LECTURA.
  rules:
    - "Una sola sentencia SELECT (o WITH … SELECT). SIN punto y coma final."
    - "Podés usar tu propio ORDER BY / LIMIT (ej. top 5): se respetan; el tope general es 1000 filas."
    - "Escrituras (INSERT/UPDATE/DELETE/DDL) están bloqueadas; las correcciones van por la API, nunca por SQL."
    - "Devolvé montos en centavos (bigint) y, si querés, también el texto formateado (abajo)."

expressions:
  zona_horaria: "'America/Argentina/Buenos_Aires' (UTC−3 fijo)"
  inicio_de_hoy: "date_trunc('day', now() AT TIME ZONE 'America/Argentina/Buenos_Aires') AT TIME ZONE 'America/Argentina/Buenos_Aires'"
  inicio_de_mañana: "(date_trunc('day', now() AT TIME ZONE 'America/Argentina/Buenos_Aires') + interval '1 day') AT TIME ZONE 'America/Argentina/Buenos_Aires'"
  inicio_de_esta_semana_lunes: "date_trunc('week', now() AT TIME ZONE 'America/Argentina/Buenos_Aires') AT TIME ZONE 'America/Argentina/Buenos_Aires'"
  inicio_de_este_mes: "date_trunc('month', now() AT TIME ZONE 'America/Argentina/Buenos_Aires') AT TIME ZONE 'America/Argentina/Buenos_Aires'"
  dia_local_de_una_fecha: "to_char(col AT TIME ZONE 'America/Argentina/Buenos_Aires', 'YYYY-MM-DD')"
  literal_de_dia: "TIMESTAMPTZ '2026-10-01 00:00:00-03'  -- medianoche de BA"
  formato_ars: "'$ ' || translate(to_char(<centavos> / 100.0, 'FM999,999,999,990.00'), ',.', '.,')   -- 3731666000 → '$ 37.316.660,00'"
  formato_usd: "'US$ ' || translate(to_char(<centavos_usd> / 100.0, 'FM999,999,999,990.00'), ',.', '.,')"
  redondeo_a_centavo: "round(<numeric>)::bigint  -- mitad hacia afuera, igual que la app"
